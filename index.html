<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse by Job Categories</title>
  <link rel="stylesheet" href="job-categories.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Browse by<br><span class="highlight">Job</span> Categories</h1>
    </header>

    <section class="categories" aria-label="Job categories">
      <a class="category-card" href="#digital-marketing">
        <span class="icon" aria-hidden="true">◀</span>
        <span class="card-info">
          <span class="category-name">Digital Marketing</span>
          <span class="job-count">143 Jobs Opened</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="category-card" href="#art-design">
        <span class="icon" aria-hidden="true">✎</span>
        <span class="card-info">
          <span class="category-name">Art &amp; Design</span>
          <span class="job-count">110 Jobs Opened</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="category-card category-card--featured" href="#accounting">
        <span class="icon icon--featured" aria-hidden="true">$</span>
        <span class="card-info">
          <span class="category-name">Accounting</span>
          <span class="job-count">158 Jobs Opened</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="category-card" href="#photography">
        <span class="icon" aria-hidden="true">◎</span>
        <span class="card-info">
          <span class="category-name">Photography</span>
          <span class="job-count">95 Jobs Opened</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="category-card" href="#copy-writing">
        <span class="icon" aria-hidden="true">▱</span>
        <span class="card-info">
          <span class="category-name">Copy Writing</span>
          <span class="job-count">113 Jobs Opened</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="category-card" href="#music">
        <span class="icon" aria-hidden="true">♫</span>
        <span class="card-info">
          <span class="category-name">Music</span>
          <span class="job-count">55 Jobs Opened</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="category-card" href="#human-resources">
        <span class="icon" aria-hidden="true">♟</span>
        <span class="card-info">
          <span class="category-name">Human Resources</span>
          <span class="job-count">25 Jobs Opened</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="category-card category-card--more" href="#more-categories">
        <span class="more-title">Explore<br>30 More<br>Categories</span>
        <span class="more-arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
</body>
</html>
